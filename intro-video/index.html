<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Up Intro</title>
<style>
@font-face{font-family:"Anton";src:url(fonts/anton.woff2) format("woff2");font-display:block}
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}

/* Pull Up · After Hours tokens */
:root{
  --bg:#0A0A0A; --s1:#141414; --s2:#1F1F1F; --line:#282828;
  --text:#F4F1EA; --sub:#CFCBC2; --muted:#8D8A84; --gold:#FFC53D; --pin:#4D99FF;
  --goldgrad:linear-gradient(135deg,#FFEFA8 0%,#F6C744 32%,#C38A19 62%,#E9BC4F 82%,#FFE38A 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Archivo,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;perspective:2300px;perspective-origin:50% 50%}
.render #stage{left:0;top:0}
.L{position:absolute}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;letter-spacing:.005em;line-height:.94}
.gold{color:var(--gold)}
.mask{display:block;overflow:hidden}
.mask>span{display:inline-block}
.gg{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
#grain{inset:-200px;opacity:.045;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 62% at 50% 50%,transparent 60%,rgba(0,0,0,.6))}
#fade{inset:0;background:#000;opacity:0;pointer-events:none}

/* hook */
#hook{inset:0}
#hookRule{left:80px;top:470px;height:1px;width:920px;background:#3a3a3a;transform-origin:0 50%}
#hookLbl{left:80px;top:420px;font-weight:600;font-size:26px;letter-spacing:.2em;color:var(--muted)}
.hk{position:absolute;left:72px;font-size:270px}

/* logo + app launch */
.icon{position:absolute;width:250px;height:250px;border-radius:62px;background:var(--goldgrad);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.15)}
.icon svg{position:absolute;inset:0;width:100%;height:100%}
#logoWord{top:930px;width:100%;text-align:center;font-size:230px}
#launch{overflow:hidden;background:#000}
#launch img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
#launch .icon{inset:0;width:auto;height:auto;border-radius:0}

/* captions */
.cap{position:absolute;left:80px;top:150px}
.cap .h{font-size:116px;color:var(--text)}

/* phone */
#world{inset:0;transform-style:preserve-3d}
.ph{position:absolute;left:236px;top:316px;width:607px;height:1288px;transform-style:preserve-3d}
.ly{position:absolute;inset:0;border-radius:84px;background:linear-gradient(90deg,#4a4a4a,#1b1b1b 12%,#161616 88%,#4a4a4a)}
.ly.mid{background:linear-gradient(90deg,#6b5a33,#1d1a14 12%,#1d1a14 88%,#6b5a33)}
.face{position:absolute;inset:0;border-radius:84px;background:#030303;box-shadow:inset 0 0 0 2px #3a3a3a,inset 0 0 0 4px #000;backface-visibility:hidden}
.scrw{position:absolute;left:11px;top:11px;width:585px;height:1266px;border-radius:72px;overflow:hidden;background:#000}
.island{position:absolute;left:198px;top:17px;width:189px;height:55px;border-radius:28px;background:#000;z-index:80}
.glare{position:absolute;inset:0;border-radius:72px;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.06) 45%,transparent 60%);pointer-events:none}
.back{position:absolute;inset:0;border-radius:84px;background:#161616;backface-visibility:hidden;box-shadow:inset 0 0 0 2px #2c2c2c}
.back .icon{left:213px;top:200px;width:180px;height:180px;border-radius:44px}
.sbtn{position:absolute;width:16px;background:linear-gradient(#444,#222);border-radius:3px}

/* end card */
#end{inset:0}
#endIcon{left:420px;top:560px;width:240px;height:240px;border-radius:60px}
#endWord{position:absolute;top:850px;width:100%;text-align:center;font-size:250px}
#endTag{position:absolute;top:1190px;width:100%;text-align:center;font-weight:600;font-size:34px;letter-spacing:.12em;color:var(--sub)}
#stores{position:absolute;top:1330px;width:100%;display:flex;justify-content:center;gap:22px}
.store{height:96px;padding:0 40px;border-radius:999px;border:2px solid #3a3a3a;display:flex;align-items:center;gap:16px;font-weight:700;font-size:27px;letter-spacing:.04em}
.store.on{background:var(--goldgrad);border-color:transparent;color:#0A0A0A}
.store svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* =================== APP (390 × 844 logical units, drawn at 1.5×) =================== */
.app{position:absolute;left:0;top:0;width:390px;height:844px;background:var(--bg);color:var(--text);font-family:Archivo,sans-serif;overflow:hidden;transform:scale(1.5);transform-origin:0 0}
.app svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app .A{position:absolute}
.shot{position:absolute;left:0;top:0;width:390px;height:846.3px}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:8px 28px 0 36px;font-weight:700;font-size:15px;z-index:30}
.sb .ic{display:flex;gap:6px;align-items:center}

/* overlay drawn in screenshot pixels (729 × 1582) so measurements map 1:1 */
.ov{position:absolute;left:0;top:0;width:729px;height:1582px;transform:scale(.534979);transform-origin:0 0}
.pin{position:absolute;width:0;height:0;transform-origin:0 0}
.pin svg{position:absolute;overflow:visible}
.ring{position:absolute;border:3px solid var(--pin);border-radius:50%;opacity:0}
.pc{position:absolute;top:1151px;width:576px;height:227px;border-radius:30px;background:#0e0d0f;box-shadow:inset 0 0 0 2px var(--bd,#2c2b2e);overflow:hidden}
.pc .th{position:absolute;left:20px;top:22px;width:154px;height:185px;border-radius:18px;overflow:hidden;background-size:cover;background-position:center}
.pc .tt{position:absolute;left:196px;top:21px;font-family:Anton;font-size:39px;line-height:1;color:#f4f1ea;letter-spacing:.005em;white-space:nowrap}
.pc .mt{position:absolute;left:196px;top:68px;width:262px;font-stretch:125%;font-weight:700;font-size:18.2px;line-height:25px;letter-spacing:.075em;color:#a3a098}
.pc .go{position:absolute;left:196px;top:178px;display:flex;align-items:center;gap:14px;font-stretch:125%;font-weight:700;font-size:18.2px;letter-spacing:.075em;color:#dcd8cf}
.pc .go i{width:19px;height:19px;border-radius:50%;background:var(--pin)}
.pc .bt{position:absolute;left:490px;top:81px;width:66px;height:66px;border-radius:50%;background:#fec33d;display:grid;place-items:center}
#pager{position:absolute;left:0;width:729px;top:1388px;height:10px;display:flex;justify-content:center;align-items:center;gap:10px}
#pager i{display:block;height:8px;border-radius:5px;background:#605f63}
.finger{position:absolute;width:0;height:0;opacity:0;z-index:50}
.finger i{position:absolute;left:-36px;top:-36px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.38);box-shadow:0 0 0 2.5px rgba(255,255,255,.75)}
.finger u{position:absolute;left:-36px;top:-36px;width:72px;height:72px;border-radius:50%;border:3px solid #fff;opacity:0}

/* + menu sheet */
#dim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;z-index:40}
#sheet{position:absolute;left:0;right:0;bottom:0;height:318px;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line);z-index:41;padding:10px 18px 0}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:#3a3a3a;margin:0 auto 18px}
#sheet h4{font-family:Anton;font-weight:400;font-size:22px;letter-spacing:.01em}
#sheet p{font-size:11.5px;color:var(--muted);margin:4px 0 14px}
.opt{position:relative;display:flex;align-items:center;gap:14px;height:66px;padding:0 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);margin-bottom:9px}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-size:19px;color:var(--sub)}
.opt.on .ic{background:var(--gold);color:#0a0a0a}
.opt b{display:block;font-size:14.5px;font-weight:700}.opt small{font-size:10.5px;color:var(--muted)}
.opt .chev{margin-left:auto;color:var(--muted);font-size:16px}

/* new party form */
.lbl{font-size:8px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--gold);color:#0A0A0A;font-weight:800}
.chipd{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.6);font-size:9.5px;font-weight:700}
.tg{width:42px;height:25px;border-radius:999px;background:#333;position:relative;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff}
.tg.on{background:var(--gold)}.tg.on::after{left:20px}
.caret{display:inline-block;width:2px;height:16px;background:var(--gold);margin-left:1px;vertical-align:-3px}
.seg{display:flex;gap:6px}.seg>div{position:relative;flex:1;height:38px;border-radius:999px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.seg>div.on{background:var(--gold);color:#0A0A0A;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{font-size:12.5px;font-weight:600}.row .k small{display:block;font-size:8.5px;color:var(--muted);font-weight:500;margin-top:2px;max-width:180px}
.row .v{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.tap{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:90;opacity:0}
.tap i{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.38);box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.tap u{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;opacity:0}

/* preview controls */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.75);color:#fff;font:600 13px system-ui;z-index:99}
#ctl input{flex:1}#ctl button{font:inherit;padding:6px 14px;border-radius:6px;border:0;cursor:pointer}
.render #ctl{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="L" id="hook">
    <div class="L" id="hookLbl">FRIDAY, 11:42 PM</div>
    <div class="L" id="hookRule"></div>
    <div class="hk anton mask" style="top:520px"><span>WHERE'S</span></div>
    <div class="hk anton mask" style="top:770px"><span>EVERYONE</span></div>
    <div class="hk anton mask" style="top:1020px"><span class="gold">TONIGHT?</span></div>
  </div>

  <div class="L anton" id="logoWord"></div>
  <div class="L" id="launch"><img src="shots/discover.png" alt=""><div class="icon" id="launchIcon"></div></div>

  <div class="L" id="world"></div>
  <div class="L" id="caps" style="inset:0"></div>

  <div class="L" id="end">
    <div class="icon" id="endIcon"></div>
    <div id="endWord" class="anton"></div>
    <div id="endTag"></div>
    <div id="stores"></div>
  </div>

  <div class="L" id="vig"></div>
  <div class="L" id="grain"></div>
  <div class="L" id="fade"></div>
</div>

<div id="ctl"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="26" step="0.0333" value="0"><span id="tc">0.00s</span></div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  brand: "PULL UP",
  tagline: "WHERE'S EVERYONE TONIGHT?",
  newParty: { name: "ROOFTOP SZN", meta: "TONIGHT 10 PM · 0.2 MI · FREE" },   // the party posted in the video
};
const DUR = 26;

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const P = (t, s, d) => cl((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  sm: x => x * x * x * (x * (x * 6 - 15) + 10),                       // smootherstep: soft start and landing for camera moves
  spring: x => 1 - Math.exp(-6.5 * x) * Math.cos(7.5 * x) * (1 - x),  // small overshoot, for UI settling like iOS scroll snapping
};
const S = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, v) => { el.style.display = v ? "" : "none"; };
function track(t, keys) {
  if (t <= keys[0][0]) return { ...keys[0][1] };
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) { const [t0, v0] = keys[i - 1]; const x = (E[e || "sm"])((t - t0) / (t1 - t0)); const o = {};
      for (const k in v1) o[k] = lerp(v0[k] ?? v1[k], v1[k], x); return o; }
  }
  return { ...keys[keys.length - 1][1] };
}
const xf = p => `translate3d(${p.x || 0}px,${p.y || 0}px,${p.z || 0}px) rotateX(${p.rx || 0}deg) rotateY(${p.ry || 0}deg) rotateZ(${p.rz || 0}deg) scale(${p.s ?? 1})`;

const ICONS = {
  chevR: '<path d="m9 18 6-6-6-6"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/>',
  ticket: '<path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v2M13 11v2M13 16v2"/>',
  film: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>', play: '<path d="M5 3.5v17l14-8.5z"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const tapEl = () => '<div class="tap"><i></i><u></u></div>';
const arrowSVG = (w = 9) => `<svg viewBox="0 0 100 100"><path d="M31 69 69 31M38 31h31v31" fill="none" stroke="#0A0A0A" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" class="arw"/></svg>`;
const SB = `<div class="sb"><span>9:41</span><span class="ic"><svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#fff"/></svg>
  <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 10.5 5.6 8a3.4 3.4 0 0 1 4.8 0zM3.4 5.8a6.6 6.6 0 0 1 9.2 0l-1.4 1.4a4.6 4.6 0 0 0-6.4 0zM1 3.4a10 10 0 0 1 14 0l-1.4 1.4a8 8 0 0 0-11.2 0z" fill="#fff"/></svg>
  <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#fff"/><rect x="23" y="4" width="1.5" height="4" rx=".7" fill="#fff" fill-opacity=".4"/></svg></span></div>`;

/* screenshot pixel → overlay coordinate (prep-shots.sh crops the screenshots' 2px / 12px frame) */
const X = x => x - 2, Y = y => y - 12;

/* ================= map pins: copies of the app's pins, measured from the screenshot ================= */
const FLAME = '<path d="M0 -11c1.6 3.6 6 6.3 6 11.4a6 6 0 0 1-12 0c0-2.8 1.4-4.8 2.8-6.1.3 2.1 1.3 3.3 2.6 3.9-.9-3.6.1-6.8.6-9.2z" fill="#0c0a13"/>';
function teardrop(r, d) { const g = Math.acos(r / d), tx = r * Math.sin(g), ty = -d + r * Math.cos(g); return `M0 0 L${tx.toFixed(2)} ${ty.toFixed(2)} A${r} ${r} 0 1 0 ${(-tx).toFixed(2)} ${ty.toFixed(2)} Z`; }
function pinHTML(kind) {   // drawn around the tip at (0,0)
  if (kind === "big") return `<svg width="1" height="1"><ellipse cx="0" cy="9.4" rx="54.4" ry="34.4" fill="rgba(77,153,255,.32)" stroke="rgba(77,153,255,.75)" stroke-width="2"/>
    <circle cx="0" cy="-50.1" r="41.9" fill="#fff"/><path d="${teardrop(35.9, 50.1)}" fill="#4d99ff"/><g transform="translate(0 -51) scale(1.12)">${FLAME}</g></svg>`;
  return `<svg width="1" height="1"><ellipse cx="0" cy="4.2" rx="14.6" ry="8.3" fill="rgba(77,153,255,.32)" stroke="rgba(77,153,255,.75)" stroke-width="1.6"/>
    <path d="${teardrop(28.3, 35.8)}" fill="#4d99ff"/><g transform="translate(0 -37) scale(.9)">${FLAME}</g></svg>`;
}
// tip positions in screenshot pixels; "yes" and "kieran" sit exactly on the pins already in the screenshot
const PINS = { test: { x: 560, y: 700, k: "small", baked: 0 }, yes: { x: 366.7, y: 824.5, k: "big", baked: 1 },
               kieran: { x: 225.8, y: 928.3, k: "small", baked: 1 }, mine: { x: 440, y: 935, k: "small", baked: 0 } };

/* ================= map carousel (rebuilt from the screenshot's card so it can be swiped) ================= */
const CARDS = [
  { t: "TEST", m: "TONIGHT 9 PM · 0.4 MI · FREE", th: "shots/thumb-test.jpg" },
  { t: "YES", m: "TONIGHT 9 PM · 0.4 MI · FREE", th: "shots/thumb-yes.jpg" },
  { t: "KIERAN VENIERIS", m: "TONIGHT 9 PM · 0.4 MI · FREE", th: "shots/thumb-kieran.jpg" },
  { t: "LATE ONE", m: "TONIGHT 11 PM · 0.9 MI · $10", th: "shots/thumb-yes.jpg" },
];
const cardHTML = c => `<div class="th" style="background-image:url(${c.th})"></div><div class="tt">${c.t}</div><div class="mt">${c.m}</div>
  <div class="go"><i></i><span class="gn">1</span> GOING</div><div class="bt"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>`;

/* ================= screens ================= */
const SCREEN = {
  discover: () => `<div class="app"><img class="shot" src="shots/discover.png" alt="">${SB}
    <div class="ov"><div class="finger" data-r="fd"><i></i><u></u></div></div></div>`,
  map: () => `<div class="app"><img class="shot" src="shots/map.png" alt="">
    <div class="ov">
      ${Object.entries(PINS).map(([id, p]) => `<div class="ring" data-ring="${id}"></div><div class="pin" data-pin="${id}" style="left:${X(p.x)}px;top:${Y(p.y)}px">${pinHTML(p.k)}</div>`).join("")}
      ${CARDS.map((c, i) => `<div class="pc" data-card="${i}">${cardHTML(c)}</div>`).join("")}
      <div id="pager"></div>
      <div class="finger" data-r="fm"><i></i><u></u></div>
    </div>${SB}
    <div id="dim"></div>
    <div id="sheet"><div class="grab"></div><h4>CREATE</h4><p>What are you putting out tonight?</p>
      <div class="opt on" data-r="optHost"><div class="ic">${icon("ticket")}</div><div><b>Host a party</b><small>Set the vibe, guest list and door</small></div><span class="chev">${icon("chevR")}</span>${tapEl()}</div>
      <div class="opt"><div class="ic">${icon("film")}</div><div><b>Post a story</b><small>Clips from where you are</small></div><span class="chev">${icon("chevR")}</span></div>
      <div class="opt"><div class="ic">${icon("camera")}</div><div><b>Post a photo</b><small>Share it to your profile</small></div><span class="chev">${icon("chevR")}</span></div>
    </div></div>`,
  create: () => `<div class="app">${SB}
    <div class="A" style="left:16px;top:58px;font-size:20px">${icon("x")}</div>
    <div class="A anton" style="left:0;right:0;top:60px;text-align:center;font-size:18px">NEW PARTY</div>
    <div class="A" style="left:16px;right:16px;top:96px;height:170px;border-radius:18px;overflow:hidden;background:url(shots/cover.jpg) center/cover">
      <div class="chipd" style="position:absolute;right:10px;bottom:10px">${icon("image")} Change cover</div></div>
    <div class="A box" data-r="fname" style="left:16px;right:16px;top:280px;height:52px;display:flex;align-items:center;padding:0 16px;font-size:13.5px;font-weight:800;letter-spacing:.06em"><span data-r="name"></span><span class="caret" data-r="caret"></span><span data-r="ph" style="color:var(--muted)">PARTY NAME</span></div>
    <div class="A lbl" style="left:20px;top:348px">WHEN &amp; WHERE</div>
    <div class="A box" style="left:16px;right:16px;top:364px;overflow:hidden">
      <div class="row" style="height:44px"><div class="k">Date</div><div class="v">Tonight ${icon("chevR")}</div></div>
      <div class="row" style="height:44px"><div class="k">Starts</div><div class="v">10:00 PM ${icon("chevR")}</div></div>
      <div class="row" style="height:58px"><div class="k">Location<small>Only approved guests see the exact address</small></div><div class="v">La Jolla ${icon("chevR")}</div></div></div>
    <div class="A lbl" style="left:20px;top:528px">WHO CAN SEE IT</div>
    <div class="A seg" style="left:16px;right:16px;top:544px"><div data-r="sg0" class="on">Public</div><div data-r="sg1">Friends${tapEl()}</div><div>Invite only</div></div>
    <div class="A lbl" style="left:20px;top:598px">GUESTS</div>
    <div class="A box" style="left:16px;right:16px;top:614px;overflow:hidden">
      <div class="row" style="height:50px"><div class="k">Approve every guest<small>You choose who gets the address</small></div><div class="tg on"></div></div>
      <div class="row" style="height:46px"><div class="k">Show who's going</div><div class="tg on"></div></div></div>
    <div class="A pbtn" data-r="post" style="left:16px;right:16px;top:736px;height:50px;font-size:14px;background:var(--goldgrad)"><span data-r="postL">Post party</span> ${icon("arrow")}${tapEl()}</div></div>`,
};

/* ================= phone (layered slab = real thickness for the side views) ================= */
const T = 42, NL = 22;
function makePhone(id, screen) {
  const el = document.createElement("div"); el.className = "ph"; el.id = id;
  let h = "";
  for (let i = 0; i < NL; i++) h += `<div class="ly${i === NL >> 1 ? " mid" : ""}" style="transform:translateZ(${(-T / 2 + T * i / (NL - 1)).toFixed(2)}px)"></div>`;
  h += `<div class="back" style="transform:translateZ(${-T / 2 - .6}px) rotateY(180deg)"><div class="icon">${arrowSVG()}</div></div>`;
  [[290, 60], [390, 110], [530, 110]].forEach(([y, hh]) => h += `<div class="sbtn" style="height:${hh}px;top:${y}px;left:-8px;transform:rotateY(90deg) translateZ(3px)"></div>`);
  h += `<div class="sbtn" style="height:170px;top:430px;left:599px;transform:rotateY(90deg) translateZ(-3px)"></div>`;
  h += `<div class="face" style="transform:translateZ(${T / 2 + .6}px)"><div class="scrw">${screen}<div class="island"></div></div><div class="glare"></div></div>`;
  el.innerHTML = h; $("#world").appendChild(el);
  return el;
}
const R = (root, k) => root.querySelector(`[data-r="${k}"]`);
const P1 = makePhone("p1", `<div data-s="discover" style="position:absolute;inset:0">${SCREEN.discover()}</div>
  <div data-s="map" style="position:absolute;inset:0">${SCREEN.map()}</div>
  <div data-s="create" style="position:absolute;inset:0">${SCREEN.create()}</div>`);
const sDisc = $('[data-s="discover"]', P1), sMap = $('[data-s="map"]', P1), sCreate = $('[data-s="create"]', P1);

/* ================= build ================= */
$("#launchIcon").innerHTML = arrowSVG();
$("#endIcon").innerHTML = arrowSVG();
const letters = (el, txt) => { el.innerHTML = [...txt].map(c => `<span class="mask" style="display:inline-block;vertical-align:top"><span class="gg">${c === " " ? "&nbsp;" : c}</span></span>`).join(""); return $$(".mask>span", el); };
const logoCh = letters($("#logoWord"), CONFIG.brand), endCh = letters($("#endWord"), CONFIG.brand);
$("#endTag").textContent = CONFIG.tagline;
$("#stores").innerHTML = `<div class="store on"><svg viewBox="0 0 24 24">${ICONS.phone}</svg> App Store</div><div class="store"><svg viewBox="0 0 24 24">${ICONS.play}</svg> Google Play</div>`;

const CAPS = [
  { a: 4.05, b: 6.55, l: ["SEE WHO'S OUT", "TONIGHT"] },
  { a: 7.45, b: 10.95, l: ["SWIPE THROUGH", "EVERY PARTY"] },
  { a: 11.6, b: 15.2, l: ["THROWING ONE?", "POST IT"] },
  { a: 15.85, b: 18.5, l: ["LIVE ON THE MAP", "IN SECONDS"] },
];
CAPS.forEach(c => {
  const d = document.createElement("div"); d.className = "cap";
  d.innerHTML = `<div class="h anton">${c.l.map(ln => `<span class="mask"><span>${ln}</span></span>`).join("")}</div>`;
  $("#caps").appendChild(d); c.el = d; c.lines = $$(".mask>span", d);
});

/* ================= refs ================= */
const el = {
  grain: $("#grain"), fade: $("#fade"), hook: $("#hook"), hookLbl: $("#hookLbl"), hookRule: $("#hookRule"), hk: $$(".hk>span"),
  logoWord: $("#logoWord"), launch: $("#launch"), launchIcon: $("#launchIcon"),
  end: $("#end"), endTag: $("#endTag"), stores: $$(".store"), back: $(".back", P1),
};
const M = {
  pins: Object.fromEntries(Object.keys(PINS).map(k => [k, $(`[data-pin="${k}"]`, sMap)])),
  rings: Object.fromEntries(Object.keys(PINS).map(k => [k, $(`[data-ring="${k}"]`, sMap)])),
  cards: $$(".pc", sMap), pager: $("#pager", sMap), fm: R(sMap, "fm"), fd: R(sDisc, "fd"),
  dim: $("#dim", sMap), sheet: $("#sheet", sMap), optHost: R(sMap, "optHost"),
  name: R(sCreate, "name"), ph: R(sCreate, "ph"), caret: R(sCreate, "caret"), fname: R(sCreate, "fname"),
  sg0: R(sCreate, "sg0"), sg1: R(sCreate, "sg1"), post: R(sCreate, "post"), postL: R(sCreate, "postL"),
};
const STAGE = $("#stage");

/* ================= interaction helpers ================= */
function tap(target, t, t0) {
  const tp = target.querySelector(":scope > .tap"); if (!tp) return;
  const d = t - t0;
  if (d < -.3 || d > .6) { tp.style.opacity = 0; return; }
  const dot = tp.firstChild, ring = tp.lastChild, app = E.out(P(d, -.3, .25)), rel = P(d, .1, .35);
  tp.style.opacity = 1;
  S(dot, { opacity: app * (1 - rel), transform: `scale(${d < 0 ? lerp(1.4, 1, app) : d < .1 ? .82 : lerp(.82, 1.1, rel)})` });
  S(ring, { opacity: d < 0 ? 0 : (1 - P(d, 0, .5)) * .9, transform: `scale(${1 + E.out(P(d, 0, .5)) * 1.5})` });
}
const press = (t, t0) => { const d = t - t0; return d > -.03 && d < .14 ? .95 : 1; };
/* finger in overlay space following [{t,x,y}] points (down at the first, lift at the last); picks whichever gesture is active */
function finger(f, t, gestures) {
  const g = gestures.find(p => t >= p[0].t - .3 && t <= p[p.length - 1].t + .5);
  if (!g) { f.style.opacity = 0; return; }
  const k = track(t, g.map((p, i) => [p.t, { x: p.x, y: p.y }, i ? "io" : "lin"]));
  const first = g[0].t, last = g[g.length - 1].t, app = E.out(P(t, first - .3, .25)), leave = P(t, last, .35);
  S(f, { left: k.x + "px", top: k.y + "px", opacity: app });
  S(f.firstChild, { transform: `scale(${t < first ? lerp(1.35, 1, app) : t < last ? .86 : lerp(.86, 1.1, leave)})`, opacity: 1 - leave });
  S(f.lastChild, { opacity: t < last ? 0 : (1 - P(t, last, .45)) * .9, transform: `scale(${1 + E.out(P(t, last, .45)) * 1.4})` });
}
const maskIn = (els, t, tin, tout, stag = .08, dur = .55) => els.forEach((e, i) => {
  const pi = E.out5(P(t, tin + i * stag, dur)), po = E.in(P(t, tout + i * .04, .3));
  e.style.transform = `translateY(${(1 - pi) * 105 - po * 105}%)`;
});

/* ================= choreography ================= */
// one continuous phone: frontal (matches the app-launch rect) → 3/4 left on Discover → laid back for the map →
// 3/4 right while posting → back to the map → side profile → back of the phone, whose logo becomes the end card
const PK = [
  [3.45,  { x: 0,    y: 0,   rx: 0,  ry: 0,    rz: 0,  s: 1 }],
  [4.95,  { x: 120,  y: 200, rx: 6,  ry: -18,  rz: 0,  s: .9 }],
  [6.55,  { x: 140,  y: 210, rx: 7,  ry: -23,  rz: 0,  s: .91 }, "lin"],
  [7.9,   { x: 0,    y: 150, rx: 28, ry: 0,    rz: -3, s: 1.15 }],
  [11.0,  { x: -6,   y: 140, rx: 26, ry: 0,    rz: -1, s: 1.2 }, "lin"],
  [12.45, { x: -120, y: 212, rx: 5,  ry: 20,   rz: 0,  s: .88 }],
  [14.9,  { x: -132, y: 218, rx: 6,  ry: 25,   rz: 0,  s: .89 }, "lin"],
  [16.1,  { x: 0,    y: 150, rx: 27, ry: -4,   rz: -2, s: 1.15 }],
  [18.55, { x: 0,    y: 140, rx: 25, ry: -7,   rz: -1, s: 1.2 }, "lin"],
  [19.65, { x: 0,    y: 150, rx: 4,  ry: -78,  rz: 0,  s: .96 }],
  [20.8,  { x: 0,    y: 190, rx: 0,  ry: -180, rz: 0,  s: 1.317 }],
];
// carousel index over time: 0 TEST → 1 YES → 2 KIERAN (two swipes), then 3 = the party you post
function carousel(t) {
  const swipe = (t0, t1) => .42 * E.io(P(t, t0, t1 - t0)) + (t > t1 ? .58 * E.spring(P(t, t1, .5)) : 0);
  return swipe(8.45, 8.8) + swipe(9.9, 10.25) + (t > 15.7 ? E.spring(P(t, 15.7, .6)) : 0);
}
const PULSE = { test: 7.35, yes: 8.95, kieran: 10.4, mine: 15.85 };
const MAP_TOUCHES = [
  [{ t: 8.42, x: 470, y: 1265 }, { t: 8.8, x: 250, y: 1270 }],      // swipe → YES
  [{ t: 9.87, x: 470, y: 1268 }, { t: 10.25, x: 250, y: 1272 }],    // swipe → KIERAN
  [{ t: 11.05, x: X(366), y: Y(1484) }, { t: 11.12, x: X(366), y: Y(1484) }],   // tap +
];

/* ================= render one frame ================= */
function renderAt(t) {
  S(el.grain, { transform: `translate(${(Math.sin(t * 977) * 100) | 0}px,${(Math.cos(t * 613) * 100) | 0}px)` });

  /* hook 0–2s */
  show(el.hook, t < 2.0);
  if (t < 2.0) {
    el.hookRule.style.transform = `scaleX(${E.io(P(t, .05, .6))})`;
    S(el.hookLbl, { opacity: P(t, .1, .3), transform: `translateY(${(1 - E.out(P(t, .1, .4))) * 20}px)` });
    [.3, .8, 1.3].forEach((tin, i) => { el.hk[i].style.transform = `translateY(${(1 - E.out5(P(t, tin, .42))) * 105 - E.in(P(t, 1.8 + i * .04, .18)) * 105}%)`; });
    el.hookLbl.style.opacity = P(t, .1, .3) * (1 - P(t, 1.8, .15)); el.hookRule.style.opacity = 1 - P(t, 1.8, .15);
  }

  /* logo on the drop, then the icon opens into the app like an iOS launch (2.75–3.45s) */
  show(el.logoWord, t >= 2 && t < 3.1);
  if (t >= 2 && t < 3.1) {
    logoCh.forEach((c, i) => { c.style.transform = `translateY(${(1 - E.out5(P(t, 2.08 + i * .03, .45))) * 105}%)`; });
    const o = E.in(P(t, 2.58, .22)); S(el.logoWord, { opacity: 1 - o, transform: `translateY(${o * 50}px)` });
  }
  const lOn = t >= 2 && t < 3.47; show(el.launch, lOn);
  if (lOn) {
    const pop = lerp(.82, 1, E.out5(P(t, 2.02, .45))), g = E.sm(P(t, 2.75, .7)), pp = 1.0095;   // pp: the screen sits 21px in front of the phone's center plane
    const w = lerp(250 * pop, 585 * pp, g), h = lerp(250 * pop, 1266 * pp, g), cy = lerp(765, 960, g), r = lerp(62 * pop, 72 * pp, g);
    S(el.launch, { left: 540 - w / 2 + "px", top: cy - h / 2 + "px", width: w + "px", height: h + "px", borderRadius: r + "px" });
    el.launchIcon.style.opacity = 1 - E.io(P(t, 2.85, .35));
    const arw = $(".arw", el.launchIcon); arw.style.strokeDasharray = 120; arw.style.strokeDashoffset = 120 * (1 - E.out(P(t, 2.1, .35)));
  }

  /* the phone */
  const pOn = t >= 3.45 && t < 21.0; show(P1, pOn);
  if (pOn) {
    P1.style.transform = xf(track(t, PK));
    const melt = E.io(P(t, 20.35, .55));            // the back plate melts into the background, leaving only the logo
    const c = Math.round(lerp(22, 10, melt));
    S(el.back, { background: `rgb(${c},${c},${c})`, boxShadow: `inset 0 0 0 2px rgba(44,44,44,${1 - melt})` });

    // screens
    const form = E.sm(P(t, 12.05, .45)) * (1 - E.sm(P(t, 15.0, .45)));
    show(sDisc, t < 6.95); show(sMap, t > 6.75); show(sCreate, form > .001);
    sDisc.style.opacity = 1 - P(t, 6.8, .12);
    sCreate.style.transform = `translateY(${(1 - form) * 100}%)`;
    finger(M.fd, t, [[{ t: 6.72, x: X(225), y: Y(1490) }, { t: 6.8, x: X(225), y: Y(1490) }]]);   // tap Map

    // map: swipeable cards
    const ci = carousel(t), posted = t >= 15.3;
    M.cards.forEach((card, i) => {
      const off = i - ci, near = cl(1 - Math.abs(off) * 2.2);
      card.style.left = (X(79) + off * 598) + "px";
      card.style.setProperty("--bd", `rgb(${lerp(44, 141, near)},${lerp(43, 110, near)},${lerp(46, 41, near)})`);
    });
    const c3 = M.cards[3];
    if (posted !== (c3.dataset.mine === "1")) {        // the posted party takes the next slot (hidden under the form when it swaps)
      c3.dataset.mine = posted ? "1" : "0";
      c3.innerHTML = cardHTML(posted ? { t: CONFIG.newParty.name, m: CONFIG.newParty.meta, th: "shots/thumb-new.jpg" } : CARDS[3]);
    }
    if (posted) $(".gn", c3).textContent = Math.max(1, Math.round(E.out(P(t, 16.45, 1.4)) * 24));
    const nDots = posted ? 7 : 6;
    if (M.pager.children.length !== nDots) M.pager.innerHTML = "<i></i>".repeat(nDots);
    [...M.pager.children].forEach((d, i) => { const a = cl(1 - Math.abs(i - ci)); S(d, { width: lerp(8, 32, a) + "px", height: lerp(8, 10, a) + "px", background: a > .5 ? "#ffc33e" : "#605f63" }); });
    finger(M.fm, t, MAP_TOUCHES);

    // map: a pin answers when its card lands; the new one drops in after posting
    Object.entries(PINS).forEach(([id, p]) => {
      const pin = M.pins[id], ring = M.rings[id], tp = PULSE[id], isNew = id === "mine";
      const visible = !isNew || t > 15.45; show(pin, visible); show(ring, visible);
      if (!visible) return;
      const drop = isNew ? E.out5(P(t, 15.45, .4)) : 1, bounce = t > tp ? Math.sin(cl((t - tp) / .45) * Math.PI) : 0;
      S(pin, { transform: `translateY(${(1 - drop) * -90}px) scale(${(1 + bounce * .16) * (isNew ? lerp(.6, 1, drop) : 1)})`,
        opacity: p.baked ? (bounce > 0 ? 1 : 0) : isNew ? P(t, 15.45, .12) : 1 });   // baked pins only need the copy while it moves
      const rp = P(t, tp, .9), rx = p.k === "big" ? 54 : 15, ry = p.k === "big" ? 34 : 8.5, rs = 1 + E.out(rp) * (p.k === "big" ? 2.2 : 5);
      S(ring, { left: X(p.x) - rx * rs + "px", top: Y(p.y) + (p.k === "big" ? 9.4 : 4.2) - ry * rs + "px", width: rx * 2 * rs + "px", height: ry * 2 * rs + "px",
        opacity: rp > 0 && rp < 1 ? (1 - rp) * .9 : 0 });
    });

    // + → create menu → Host a party
    const sh = E.out5(P(t, 11.2, .4)) * (1 - E.sm(P(t, 12.15, .3)));
    show(M.sheet, sh > .001); show(M.dim, sh > .001 || form > .001);
    M.sheet.style.transform = `translateY(${(1 - sh) * 340}px)`; M.dim.style.opacity = Math.max(sh, form * .9);
    tap(M.optHost, t, 11.95); M.optHost.style.transform = `scale(${press(t, 11.95)})`;

    // new party form
    const NAME = CONFIG.newParty.name, ty = P(t, 12.75, .95), n = Math.floor(ty * NAME.length);
    M.name.textContent = NAME.slice(0, n); show(M.ph, n === 0 && t < 12.7);
    const act = t > 12.6 && t < 14.0; M.caret.style.display = act && (ty > 0 && ty < 1 || Math.floor(t * 3) % 2 === 0) ? "" : "none";
    M.fname.style.borderColor = act ? "var(--gold)" : "";
    tap(M.sg1, t, 14.1); M.sg1.classList.toggle("on", t >= 14.14); M.sg0.classList.toggle("on", t < 14.14);
    tap(M.post, t, 14.65); M.postL.textContent = t >= 14.7 ? "Posted" : "Post party"; M.post.style.transform = `scale(${press(t, 14.65)})`;
  }

  /* captions */
  CAPS.forEach(c => { const on = t > c.a - .05 && t < c.b + .4; show(c.el, on); if (on) maskIn(c.lines, t, c.a, c.b); });

  /* end card: picks up exactly where the logo on the back of the phone was */
  const eOn = t >= 20.98; show(el.end, eOn);
  if (eOn) {
    el.end.style.transform = `scale(${1 + P(t, 21, 5) * .03})`;
    endCh.forEach((c, i) => { c.style.transform = `translateY(${(1 - E.out5(P(t, 21.15 + i * .035, .5))) * 105}%)`; });
    const tg = E.out(P(t, 21.6, .5)); S(el.endTag, { opacity: tg, transform: `translateY(${(1 - tg) * 14}px)` });
    el.stores.forEach((s, i) => { const p = E.out5(P(t, 22.0 + i * .1, .5)); S(s, { opacity: P(t, 22.0 + i * .1, .2), transform: `translateY(${(1 - p) * 40}px)` }); });
  }
  el.fade.style.opacity = P(t, 25.55, .45);
}

/* ================= playback ================= */
const RENDER = new URLSearchParams(location.search).has("render");
if (RENDER) document.documentElement.classList.add("render");
function fit() { if (RENDER) return; const s = Math.min(innerWidth / 1080, (innerHeight - 48) / 1920);
  S(STAGE, { transform: `scale(${s}) translate(-50%,-50%)`, marginTop: "-24px" }); }
fit(); addEventListener("resize", fit);
window.renderAt = renderAt;
const imgsReady = () => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.addEventListener("load", r); i.addEventListener("error", r); })));
window.READY = document.fonts.ready.then(imgsReady).then(() => { renderAt(0); return true; });
if (!RENDER) {
  let t0 = performance.now(), playing = true, cur = 0;
  const btn = $("#play"), sc = $("#scrub"), tc = $("#tc");
  const loop = now => { if (playing) { cur = ((now - t0) / 1000) % DUR; sc.value = cur; } renderAt(cur); tc.textContent = cur.toFixed(2) + "s"; requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; t0 = performance.now() - cur * 1000; };
  sc.oninput = () => { cur = +sc.value; t0 = performance.now() - cur * 1000; };
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); btn.onclick(); } });
  READY.then(() => requestAnimationFrame(loop));
}
</script>

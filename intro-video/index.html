<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Up Intro</title>
<style>
@font-face{font-family:"Anton";src:url(fonts/anton.woff2) format("woff2");font-display:block}
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:400 800;font-display:block}

/* Pull Up · After Hours tokens */
:root{
  --bg:#0A0A0A; --s1:#141414; --s2:#1F1F1F; --line:#282828;
  --text:#F4F1EA; --sub:#CFCBC2; --muted:#8D8A84; --gold:#FFC53D;
  --goldgrad:linear-gradient(135deg,#FFEFA8 0%,#F6C744 32%,#C38A19 62%,#E9BC4F 82%,#FFE38A 100%);
  --shine:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Archivo,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;perspective:2300px;perspective-origin:50% 50%}
.render #stage{left:0;top:0}
.L{position:absolute}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;letter-spacing:.005em;line-height:.94}
.gold{color:var(--gold)}
.mask{display:block;overflow:hidden}
.mask>span{display:inline-block}
.gg{background:var(--shine),var(--goldgrad);background-size:300% 100%,100% 100%;background-position:150% 0,0 0;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- background ---------- */
#grain{inset:-200px;opacity:.05;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 62% at 50% 50%,transparent 60%,rgba(0,0,0,.7))}


/* ---------- hook ---------- */
#hook{inset:0}
#hookRule{left:80px;top:470px;height:1px;width:920px;background:#3a3a3a;transform-origin:0 50%}
#hookLbl{left:80px;top:420px;font-weight:600;font-size:26px;letter-spacing:.2em;color:var(--muted)}
.hk{position:absolute;left:72px;font-size:270px}

/* ---------- logo ---------- */
#logo{inset:0}
.icon{position:absolute;width:250px;height:250px;border-radius:62px;background:var(--shine),var(--goldgrad);background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:150% 0,0 0;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.15)}
.icon svg{position:absolute;inset:0;width:100%;height:100%}
#logoIcon{left:415px;top:640px}
#logoWord{position:absolute;top:930px;width:100%;text-align:center;font-size:230px}
#bar{left:540px;top:960px;width:0;height:0;background:var(--goldgrad)}

/* ---------- captions ---------- */
.cap{position:absolute;left:80px;top:150px}
.cap .h{font-size:120px;color:var(--text)}

/* ---------- phone ---------- */
#world{inset:0;transform-style:preserve-3d}
.ph{position:absolute;left:236px;top:316px;width:607px;height:1288px;transform-style:preserve-3d}
.ly{position:absolute;inset:0;border-radius:84px;background:linear-gradient(90deg,#4a4a4a,#1b1b1b 12%,#161616 88%,#4a4a4a)}
.ly.mid{background:linear-gradient(90deg,#6b5a33,#1d1a14 12%,#1d1a14 88%,#6b5a33)}
.face{position:absolute;inset:0;border-radius:84px;background:#030303;box-shadow:inset 0 0 0 2px #3a3a3a,inset 0 0 0 4px #000;backface-visibility:hidden}
.scrw{position:absolute;left:11px;top:11px;width:585px;height:1266px;border-radius:72px;overflow:hidden;background:#000}
.scrw>.app{transform:scale(1.5);transform-origin:0 0}
.glare{position:absolute;inset:0;border-radius:72px;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);pointer-events:none}
.back{position:absolute;inset:0;border-radius:84px;background:linear-gradient(160deg,#262626,#111 60%,#1c1c1c);backface-visibility:hidden;box-shadow:inset 0 0 0 2px #333}
.back .icon{left:213px;top:200px;width:180px;height:180px;border-radius:44px}
.sbtn{position:absolute;width:16px;background:linear-gradient(#444,#222);border-radius:3px}
.pins3d{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.stand{position:absolute;width:0;height:0;transform-style:preserve-3d}
.stand .up{position:absolute;left:0;bottom:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;width:400px;margin-left:-200px}
.stand .stem{width:3px;background:linear-gradient(var(--gold),rgba(255,197,61,0))}
.stand .tagp{display:flex;align-items:center;gap:12px;height:62px;padding:0 24px 0 14px;border-radius:999px;background:#0e0e0e;border:2px solid var(--gold);
  font-weight:800;font-size:25px;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.stand .tagp .d{width:34px;height:34px;border-radius:50%;background:var(--goldgrad)}
.stand .tagp small{color:var(--gold);font-weight:800;font-size:22px}
.shadowDot{position:absolute;width:60px;height:60px;margin:-30px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,197,61,.8),rgba(255,197,61,0))}


/* ---------- wall ---------- */
#wallWrap{inset:0;perspective:2300px;perspective-origin:50% 50%}
#wall{left:0;top:0;width:1100px;height:2240px;transform-style:preserve-3d;transform-origin:550px 1120px}
.tile{position:absolute;width:195px;height:422px;border-radius:30px;overflow:hidden;box-shadow:0 0 0 1.5px #2a2a2a}
.tile>.app{transform:scale(.5);transform-origin:0 0}
#wallDim{inset:0;background:radial-gradient(ellipse 70% 40% at 50% 50%,rgba(10,10,10,.92),rgba(10,10,10,.55) 70%,rgba(10,10,10,.35))}
#scan{left:0;width:1080px;height:3px;background:#FFE38A;box-shadow:0 0 30px 6px rgba(255,197,61,.7)}

/* ---------- end ---------- */
#end{inset:0}
#endIcon{left:420px;top:560px;width:240px;height:240px;border-radius:60px}
#endWord{position:absolute;top:850px;width:100%;text-align:center;font-size:250px}
#endRule{display:none}
#endTag{position:absolute;top:1190px;width:100%;text-align:center;font-weight:600;font-size:34px;letter-spacing:.12em;color:var(--sub)}
#stores{position:absolute;top:1330px;width:100%;display:flex;justify-content:center;gap:22px}
.store{height:96px;padding:0 40px;border-radius:999px;border:2px solid #3a3a3a;display:flex;align-items:center;gap:16px;font-weight:700;font-size:27px;letter-spacing:.04em}
.store.on{background:var(--goldgrad);border-color:transparent;color:#0A0A0A}
.store svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- tap ---------- */
.tap{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:90;opacity:0}
.tap i{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.tap u{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;opacity:0}

/* =================== APP UI (390 × 844 units) =================== */
.app{position:absolute;left:0;top:0;width:390px;height:844px;background:var(--bg);color:var(--text);font-family:Archivo,sans-serif;overflow:hidden}
.app svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app .A{position:absolute}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:8px 28px 0 36px;font-weight:700;font-size:15px;z-index:30}
.sb .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);z-index:40}
.tabs{position:absolute;bottom:0;left:0;right:0;height:82px;background:var(--bg);border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:10px 10px 0;z-index:25}
.tb{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:7.5px;font-weight:700;letter-spacing:.1em}
.tb svg.i{font-size:20px}
.tb.on{color:var(--gold)}
.tb.on::after{content:"";position:absolute;bottom:-7px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.tplus{position:relative;width:50px;height:32px;margin-top:2px;border-radius:999px;background:var(--gold);color:#0A0A0A;display:grid;place-items:center;font-size:20px}
.tplus svg.i{stroke-width:2.6}
.chipd{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.6);font-size:8.5px;font-weight:800;letter-spacing:.08em}
.chipd i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.chipg{display:inline-flex;align-items:center;height:21px;padding:0 10px;border-radius:999px;background:var(--gold);color:#0A0A0A;font-size:8.5px;font-weight:800;letter-spacing:.08em}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--gold);color:#0A0A0A;font-weight:800}
.circ{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.av{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;display:grid;place-items:center;font-size:8.5px;font-weight:800;color:#e9e4da;overflow:hidden;flex:none;position:relative}
.av:first-child{margin-left:0}
.avs{display:flex}
.lbl{font-size:8px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px}
.stat3{display:flex}.stat3>div{flex:1;padding:12px 14px;border-left:1px solid var(--line)}.stat3>div:first-child{border-left:0}
.stat3 .lbl{font-size:7px;margin-bottom:6px}.stat3 b{font-size:19px;font-weight:800;line-height:1.05;display:block}
.tg{width:42px;height:25px;border-radius:999px;background:#333;position:relative;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff}
.tg.on{background:var(--gold)}.tg.on::after{left:20px}
.caret{display:inline-block;width:2px;height:16px;background:var(--gold);margin-left:1px;vertical-align:-3px}
.seg{display:flex;gap:6px}.seg>div{position:relative;flex:1;height:38px;border-radius:999px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.seg>div.on{background:var(--gold);color:#0A0A0A;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{font-size:12.5px;font-weight:600}.row .k small{display:block;font-size:8.5px;color:var(--muted);font-weight:500;margin-top:2px;max-width:180px}
.row .v{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}

/* preview controls */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.75);color:#fff;font:600 13px system-ui;z-index:99}
#ctl input{flex:1}#ctl button{font:inherit;padding:6px 14px;border-radius:6px;border:0;cursor:pointer}
.render #ctl{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter></svg>

<div id="stage">

  <!-- hook -->
  <div class="L" id="hook">
    <div class="L" id="hookLbl">FRIDAY, 11:42 PM</div>
    <div class="L" id="hookRule"></div>
    <div class="hk anton mask" style="top:520px"><span>WHERE'S</span></div>
    <div class="hk anton mask" style="top:770px"><span>EVERYONE</span></div>
    <div class="hk anton mask" style="top:1020px"><span class="gold">TONIGHT?</span></div>
  </div>

  <!-- logo -->
  <div class="L" id="logo">
    <div class="icon" id="logoIcon"></div>
    <div id="logoWord" class="anton"></div>
  </div>
  <div class="L" id="bar"></div>

  <!-- wall -->
  <div class="L" id="wallWrap"><div class="L" id="wall"></div><div class="L" id="wallDim"></div></div>
  <div class="L" id="scan"></div>

  <!-- phones -->
  <div class="L" id="world"></div>

  <!-- captions -->
  <div class="L" id="caps" style="inset:0"></div>

  <!-- end -->
  <div class="L" id="end">
    <div class="icon" id="endIcon"></div>
    <div id="endWord" class="anton"></div>
    <div class="L" id="endRule"></div>
    <div id="endTag"></div>
    <div id="stores"></div>
  </div>

  <div class="L" id="vig"></div>
  <div class="L" id="grain"></div>
</div>

<div id="ctl"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="30" step="0.0333" value="0"><span id="tc">0.00s</span></div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  brand: "PULL UP",
  handle: "@pullupapp",            // placeholder: swap for the real handle
  tagline: "WHERE'S EVERYONE TONIGHT?",
  city: "SAN DIEGO",
  mapImage: "map/map.png",         // real street map from ./fetch-map.sh; vector fallback when missing
};
const DUR = 30, BEAT = .5, DROP = 2.0;

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const P = (t, s, d) => cl((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  io5: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
};
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const S = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, v) => { el.style.display = v ? "" : "none"; };
/* keyframe track: [[time, {props}, ease], ...] — ease applies to the segment ending at that key */
function track(t, keys) {
  if (t <= keys[0][0]) return { ...keys[0][1] };
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) { const [t0, v0] = keys[i - 1]; const x = (E[e || "io"])((t - t0) / (t1 - t0)); const o = {};
      for (const k in v1) o[k] = lerp(v0[k] ?? v1[k], v1[k], x); return o; }
  }
  return { ...keys[keys.length - 1][1] };
}
const xf = p => `translate3d(${p.x || 0}px,${p.y || 0}px,${p.z || 0}px) rotateX(${p.rx || 0}deg) rotateY(${p.ry || 0}deg) rotateZ(${p.rz || 0}deg) scale(${p.s ?? 1})`;
let UID = 0;

/* ================= icons ================= */
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  compass: '<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>', chevR: '<path d="m9 18 6-6-6-6"/>', chevD: '<path d="m6 9 6 6 6-6"/>',
  heart: '<path d="M12 20s-7.5-4.6-9-9.3C2 7.5 4.2 5 7 5c2 0 3.3 1.2 5 3 1.7-1.8 3-3 5-3 2.8 0 5 2.5 4 5.7-1.5 4.7-9 9.3-9 9.3z"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  locate: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/>',
  play: '<path d="M5 3.5v17l14-8.5z"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const tapEl = () => '<div class="tap"><i></i><u></u></div>';
const arrowSVG = (w = 9) => `<svg viewBox="0 0 100 100"><path d="M31 69 69 31M38 31h31v31" fill="none" stroke="#0A0A0A" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" class="arw"/></svg>`;
const statusIcons = `<svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#fff"/></svg>
  <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 10.5 5.6 8a3.4 3.4 0 0 1 4.8 0zM3.4 5.8a6.6 6.6 0 0 1 9.2 0l-1.4 1.4a4.6 4.6 0 0 0-6.4 0zM1 3.4a10 10 0 0 1 14 0l-1.4 1.4a8 8 0 0 0-11.2 0z" fill="#fff"/></svg>
  <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#fff"/><rect x="23" y="4" width="1.5" height="4" rx=".7" fill="#fff" fill-opacity=".4"/></svg>`;
const SB = `<div class="sb"><span>9:41</span><span class="ic">${statusIcons}</span></div>`;

/* ================= photos (SVG) ================= */
function crowd(r, W, rows, id = "c" + (UID++)) {
  let s = "";
  rows.forEach(([by, r0, r1, col, arms, phones, blur = 0], ri) => {
    if (blur) s += `<filter id="${id}f${ri}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${blur}"/></filter>`;
    s += `<g ${blur ? `filter="url(#${id}f${ri})"` : ""}>`;
    let x = -15;
    while (x < W + 20) {
      const rad = r0 + r() * (r1 - r0), base = by + (r() - .5) * 10;
      s += `<circle cx="${x.toFixed(1)}" cy="${base.toFixed(1)}" r="${rad.toFixed(1)}" fill="${col}"/><ellipse cx="${x.toFixed(1)}" cy="${(base + rad * 2.7).toFixed(1)}" rx="${(rad * 1.75).toFixed(1)}" ry="${(rad * 2.1).toFixed(1)}" fill="${col}"/>`;
      if (r() < arms) {
        const sd = r() < .5 ? -1 : 1, hx = x + sd * (rad * 1.3 + r() * rad * 1.4), hy = base - rad * (2.4 + r() * 1.8);
        s += `<line x1="${(x + sd * rad * 1.1).toFixed(1)}" y1="${(base + rad * 1.6).toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${col}" stroke-width="${(rad * .6).toFixed(1)}" stroke-linecap="round"/>`;

  }
  // whip-pan motion blur
  const blur = 70 * Math.exp(-Math.pow((t - 17.0) / .09, 2));
  if (blur > .6) { el.mbg.setAttribute("stdDeviation", `${blur.toFixed(1)} 0`); el.world.style.filter = "url(#mb)"; } else el.world.style.filter = "";

  /* captions */
  CAPS.forEach(c => {
    const on = t > c.a - .05 && t < c.b + .4; show(c.el, on); if (!on) return;
    maskIn(c.lines, t, c.a + .12, c.b, .09, .55);
  });

  /* ---- wall 22.3–25.5 ---- */
  const wallOn = t > 22.3 && t < 25.75; show(el.wallWrap, wallOn); show(el.scan, t > 22.3 && t < 22.75);
  if (wallOn) {
    const sp = E.io(P(t, 22.32, .4));
    el.wallWrap.style.clipPath = `inset(0 0 ${(1 - sp) * 100}% 0)`;
    S(el.scan, { top: sp * 1920 + "px", opacity: 1 - P(t, 22.65, .1) });
    const dolly = P(t, 22.3, 3.4);
    S(el.wall, { transform: `translate(-10px,${lerp(-60, -340, dolly)}px) rotateX(${lerp(34, 26, dolly)}deg) rotateZ(${lerp(-16, -11, dolly)}deg) scale(${lerp(1.5, 1.25, dolly)})` });
    el.tiles.forEach(tl => { const [r, c] = tl.dataset.rc.split(",").map(Number), dist = Math.hypot(r - 2, c - 2);
      const q = E.in(P(t, 25.15 + (2.9 - dist) * .04, .25)); S(tl, { transform: `scale(${1 - q})`, opacity: 1 - q }); });
    el.wallDim.style.opacity = 1 - P(t, 25.1, .3) * .5;
  }

  /* ---- end 25.4–30 ---- */
  const endOn = t > 25.4; show(el.end, endOn);
  if (endOn) {
    const ip = E.out5(P(t, 25.45, .55));
    S(el.end, { transform: `scale(${1 + P(t, 25.4, 4.6) * .035})` });
    S(el.endIcon, { transform: `scale(${lerp(.75, 1, ip)})`, opacity: P(t, 25.45, .12) });
    const arw = $(".arw", el.endIcon); arw.style.strokeDasharray = 120; arw.style.strokeDashoffset = 120 * (1 - E.out(P(t, 25.55, .4)));
    endCh.forEach((c, i) => { const p = E.out5(P(t, 25.6 + i * .035, .5)); c.style.transform = `translateY(${(1 - p) * 105}%)`; });
    el.endRule.style.transform = `scaleX(${E.io(P(t, 26.1, .5))})`;
    const tg = E.out(P(t, 26.25, .5)); S(el.endTag, { opacity: tg, transform: `translateY(${(1 - tg) * 14}px)` });
    el.stores.forEach((s, i) => { const p = E.out5(P(t, 26.65 + i * .1, .5)); S(s, { opacity: P(t, 26.65 + i * .1, .2), transform: `translateY(${(1 - p) * 40}px)` }); });
  }
}

/* ================= playback ================= */
const RENDER = new URLSearchParams(location.search).has("render");
if (RENDER) document.documentElement.classList.add("render");
function fit() { if (RENDER) return; const s = Math.min(innerWidth / 1080, (innerHeight - 48) / 1920);
  S(STAGE, { transform: `scale(${s}) translate(-50%,-50%)`, marginTop: "-24px" }); }
fit(); addEventListener("resize", fit);
window.renderAt = renderAt;
const imgsReady = () => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.addEventListener("load", r); i.addEventListener("error", r); })));
window.READY = document.fonts.ready.then(imgsReady).then(() => { $$("[data-r=attr]").forEach(a => { if (!$("img", a.parentNode)) a.remove(); }); renderAt(0); return true; });
if (!RENDER) {
  let t0 = performance.now(), playing = true, cur = 0;
  const btn = $("#play"), sc = $("#scrub"), tc = $("#tc");
  const loop = now => { if (playing) { cur = ((now - t0) / 1000) % DUR; sc.value = cur; } renderAt(cur); tc.textContent = cur.toFixed(2) + "s"; requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; t0 = performance.now() - cur * 1000; };
  sc.oninput = () => { cur = +sc.value; t0 = performance.now() - cur * 1000; };
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); btn.onclick(); } });
  READY.then(() => requestAnimationFrame(loop));
}
